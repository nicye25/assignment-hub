# DRAFT: not yet run on GitHub. Replaces the earlier skeleton sync.yml.
#
# Repo secrets needed:
#   CANVAS_ICS_URL, GRADESCOPE_EMAIL, GRADESCOPE_PASSWORD
#   SITE_TOKEN   random string; the data is served from /<SITE_TOKEN>/ so the URL
#                is not guessable (obscurity, not access control)
# Optional repo variable: GRADESCOPE_TERMS (e.g. "Fall 2026")
# Settings -> Pages -> Source must be "GitHub Actions".

name: sync

on:
  schedule:
    - cron: "0 * * * *"   # hourly, UTC; GitHub may delay scheduled runs
  workflow_dispatch:      # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
      # Default project-site URL; adjust if you use a custom domain
      PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Require SITE_TOKEN
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "SITE_TOKEN secret is not set"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # The runner starts empty each time, but sync needs last run's output to keep
      # stale data and last_success when a source fails. Pull it from the live site.
      - name: Restore previous output
        run: |
          mkdir -p "site/$SITE_TOKEN"
          curl -fsS "$PAGES_BASE/$SITE_TOKEN/assignments.json" \
            -o "site/$SITE_TOKEN/assignments.json" \
            || echo "No previous output found; starting fresh"

      # continue-on-error so a failed source still gets its stale data deployed;
      # the last step turns the run red afterwards.
      - name: Sync
        id: sync
        continue-on-error: true
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          GRADESCOPE_EMAIL: ${{ secrets.GRADESCOPE_EMAIL }}
          GRADESCOPE_PASSWORD: ${{ secrets.GRADESCOPE_PASSWORD }}
          GRADESCOPE_TERMS: ${{ vars.GRADESCOPE_TERMS }}
        run: python -m aggregator.sync --out "site/$SITE_TOKEN/assignments.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail the run if any source failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "One or more sources failed; stale data was deployed. See the Sync step."
          exit 1
