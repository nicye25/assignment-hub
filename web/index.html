<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Assignments</title>
<style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#17202E;--muted:#667085;--line:#D9DFEA;--accent:#2447D6;--bad:#C4283C;--ok:#2E7D5B;--l:42%;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0F141C;--panel:#171E29;--ink:#E7ECF4;--muted:#93A0B5;--line:#263041;--accent:#8FA6FF;--bad:#FF7A8A;--ok:#6CCB9F;--l:68%}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--muted);font-size:.875rem}
.top label{display:flex;align-items:center;gap:6px;cursor:pointer}
h1{font:600 clamp(1.8rem,5vw,2.6rem)/1.15 var(--serif);margin:14px 0 6px;max-width:22ch}
.sub{margin:0;color:var(--muted);font-size:1.05rem}
.bad-note{margin:20px 0 0;color:var(--bad);font-weight:600}
#hero{margin-bottom:28px}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:10px 14px;margin-bottom:8px;font-size:.9rem}
h2{font:600 1.15rem var(--serif);margin:0 0 4px}
h2.bad{color:var(--bad)}h2.muted{color:var(--muted)}
.zone{margin-top:36px}.zone:first-child{margin-top:0}
.zone h2+.day{border-top:0}
.zone.bad{padding:14px 16px 6px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bad) 7%,transparent)}
.day{display:grid;grid-template-columns:88px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.rail{display:flex;flex-direction:column}
.num{font:600 2.1rem/1 var(--serif)}
.dow{color:var(--muted);font-size:.8rem;margin-top:4px}
.items{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:16px;background:var(--panel);border:1px solid var(--line);
border-left:4px solid hsl(var(--h) 60% var(--l));border-radius:6px;padding:10px 14px}
.title{font-weight:600;color:var(--ink);text-decoration:none}
a.title:hover{text-decoration:underline}
a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.course{font-size:.85rem;color:hsl(var(--h) 55% var(--l))}
.side{display:flex;flex-direction:column;align-items:flex-end;font-size:.85rem;color:var(--muted);white-space:nowrap}
.time{font-weight:600;color:var(--ink)}
.chip{margin-top:2px;font-size:.78rem}
.chip.todo{color:var(--accent)}.chip.ok{color:var(--ok)}
.soon .time,.soon .rel{color:var(--accent);font-weight:600}
.over .rel{color:var(--bad);font-weight:600}
.done{opacity:.6}.done .title{text-decoration:line-through}
.empty{color:var(--muted)}
@media(max-width:560px){.day{grid-template-columns:56px 1fr;gap:10px}.num{font-size:1.5rem}.item{flex-direction:column;gap:6px}.side{align-items:flex-start;flex-direction:row;gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span id="updated"></span><label><input type="checkbox" id="done"> Show completed</label></div>
  <div id="hero"></div>
  <div id="banners"></div>
  <main id="list"></main>
</div>
<script>
(() => {
const HOUR = 36e5, DAY = 864e5, STALE_AFTER = 3 * HOUR;
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayDiff = (d, now) => Math.round((sod(d) - sod(now)) / DAY);
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const safe = u => /^https?:\/\//i.test(u || "");
const timeFmt = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
const dateFmt = d => d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
function rel(ms) {
  const a = Math.abs(ms), m = Math.round(a / 6e4), h = Math.round(a / HOUR), d = Math.round(a / DAY);
  const t = m < 60 ? `${Math.max(m, 1)} min` : h < 48 ? `${h} hr` : `${d} days`;
  return ms < 0 ? `${t} ago` : `in ${t}`;
}
let data = null;

function byDay(items) {
  const m = new Map();
  for (const a of items) { const k = sod(a.due).getTime(); if (!m.has(k)) m.set(k, []); m.get(k).push(a); }
  return [...m].map(([k, g]) => [new Date(k), g]);
}

function item(a, now) {
  const isDone = a.submitted === true, over = a.due < now && !isDone;
  const soon = !over && !isDone && a.due - now < DAY;
  const li = el("article", "item" + (isDone ? " done" : "") + (over ? " over" : "") + (soon ? " soon" : ""));
  li.style.setProperty("--h", hue(a.course));
  const main = el("div");
  let title;
  if (safe(a.url)) { title = el("a", "title", a.title); title.href = a.url; title.target = "_blank"; title.rel = "noopener noreferrer"; }
  else title = el("span", "title", a.title);
  main.append(title, el("div", "course", a.course));
  const side = el("div", "side");
  side.append(el("span", "time", timeFmt(a.due)), el("span", "rel", rel(a.due - now)));
  if (a.submitted === true) side.append(el("span", "chip ok", "Done"));
  else if (a.submitted === false) side.append(el("span", "chip todo", "To do"));
  li.append(main, side);
  return li;
}

function dayRow(d, group, now) {
  const diff = dayDiff(d, now);
  const label = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString(undefined, { weekday: "short", month: "short" });
  const row = el("section", "day"), rail = el("div", "rail"), items = el("div", "items");
  rail.append(el("span", "num", String(d.getDate())), el("span", "dow", label));
  group.forEach(a => items.append(item(a, now)));
  row.append(rail, items);
  return row;
}

function render() {
  if (!data) return;
  const now = new Date(), showDone = $("#done").checked;
  const all = data.assignments.map(a => ({ ...a, due: new Date(a.due_at) })).sort((x, y) => x.due - y.due);
  const overdue = all.filter(a => a.due < now && a.submitted !== true);
  const upcoming = all.filter(a => a.due >= now && (showDone || a.submitted !== true));
  const recent = showDone ? all.filter(a => a.due < now && a.submitted === true).reverse() : [];
  const next = all.find(a => a.due >= now && a.submitted !== true);

  const hero = $("#hero"); hero.replaceChildren();
  if (overdue.length) hero.append(el("p", "bad-note", `${overdue.length} overdue`));
  if (next) hero.append(el("h1", null, next.title), el("p", "sub", `${next.course}, due ${rel(next.due - now)}`));
  else hero.append(el("h1", null, "Nothing coming up"), el("p", "sub", "No open assignments right now."));

  const gen = new Date(data.generated_at), age = now - gen;
  $("#updated").textContent = `Updated ${rel(gen - now)}`;
  const banners = $("#banners"); banners.replaceChildren();
  if (age > STALE_AFTER) banners.append(el("div", "banner", `This data is ${Math.round(age / HOUR)} hours old. Automatic updates may have stopped; check the Actions tab on GitHub.`));
  for (const [name, s] of Object.entries(data.sources || {})) {
    if (s.ok && !s.stale) continue;
    const since = s.last_success ? ` since ${dateFmt(new Date(s.last_success))} ${timeFmt(new Date(s.last_success))}` : "";
    banners.append(el("div", "banner", `${name} has not updated${since}. Its deadlines may be out of date.`));
  }

  const root = $("#list"); root.replaceChildren();
  const section = (title, cls, items) => {
    if (!items.length) return;
    const zone = el("div", "zone " + cls);
    zone.append(el("h2", cls, title));
    for (const [d, g] of byDay(items)) zone.append(dayRow(d, g, now));
    root.append(zone);
  };
  section("Overdue", "bad", overdue);
  section("Upcoming", "", upcoming);
  section("Recently completed", "muted", recent);
  if (!overdue.length && !upcoming.length && !recent.length)
    root.append(el("p", "empty", "Nothing to show. If this looks wrong, run the sync workflow."));
}

async function load() {
  try {
    const r = await fetch("assignments.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    render();
  } catch (e) {
    render();
    $("#banners").prepend(el("div", "banner", `Could not load assignments.json (${e.message}). If you opened this file directly, serve the folder over HTTP instead.`));
  }
}

$("#done").addEventListener("change", render);
load();
setInterval(load, 10 * 60e3);
setInterval(render, 60e3);
})();
</script>
</body>
</html>
