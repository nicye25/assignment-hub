[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-hub"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gradescopeapi",
  "canvasapi",
  "requests",
  "icalendar",
  "pyyaml",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
